name: validate-active-context
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validar estado canonico
        run: python3 tools/acx_validate.py
      - name: Validar quarentena de imports legados
        run: python3 -m pytest tests/test_no_legacy_imports.py -q
